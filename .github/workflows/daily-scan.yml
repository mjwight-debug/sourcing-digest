name: Daily Sourcing Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sourcing-machine
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Save today's scan to history
        run: |
          git config user.name "sourcing-bot"
          git config user.email "actions@github.com"
          git add sourcing-machine/history/ || true
          git diff --cached --quiet || git commit -m "Log scan history"
          git push || true
